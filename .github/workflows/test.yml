name: SpectraGuard Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run SpectraGuard Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run SpectraGuard Full Test Suite
        env:
          DATABASE_URL_OVERRIDE: "sqlite:///./test_spectraguard.db"
          APP_ENV: "development"
          JWT_SECRET_KEY: "spectraguard-ci-secret-key"
        run: |
          python tests/run_all_tests.py

      - name: Upload Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGuard_Test_Report
          path: SpectraGuard_Test_Report.xlsx
          if-no-files-found: error

      - name: Upload APM HTML, JSON & Excel Reports
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGuard_APM_Reports
          path: |
            reports/apm_report.html
            reports/apm_report.json
            reports/APM_Report.xlsx
          if-no-files-found: warn


